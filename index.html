<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreame T16 Pro Steam – Académie Fnac Darty</title>
<meta name="description" content="E-learning : déballage, connexion, utilisation, entretien et FAQ du balai laveur Dreame T16 Pro Steam.">
<style>:root{--black:#111;--ink:#1d1d1f;--yellow:#E9AB00;--yellow-l:#FFF3CC;--red:#C10F1E;--red-l:#FDECEE;--green:#0B8A43;--green-l:#E4F5EB;--bg:#F1F1F1;--line:#E1E1E1;--mut:#5b5b5f}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.4}
button{font:inherit;cursor:pointer}
header{background:var(--black);color:#fff;position:relative;overflow:hidden}
.hd{max-width:1280px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:16px}
.hd img{height:60px;width:auto;display:block}
.hd h1{font-size:20px;line-height:1.15;margin:0;font-weight:700;flex:1}
.hd h1 small{display:block;font-weight:400;font-size:14px;color:#cfcfcf;margin-top:2px}
.chev{position:absolute;right:0;top:0;bottom:0;width:90px;background:linear-gradient(180deg,#FBAE40,#C10F1E);clip-path:polygon(60% 0,100% 0,100% 100%,60% 100%,100% 50%);opacity:.95}
.hd .pg{font-size:14px;text-align:right;color:#ddd;margin-right:70px;white-space:nowrap}
.bar{height:5px;background:#333}.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}
nav.steps{background:#fff;border-bottom:1px solid var(--line)}
nav.steps .in{max-width:1280px;margin:0 auto;display:flex;gap:4px;padding:6px 20px;overflow-x:auto}
nav.steps button{flex:1 1 0;min-width:112px;border:2px solid transparent;background:#f4f4f4;border-radius:10px;padding:5px 8px;text-align:left;color:#333;display:flex;gap:7px;align-items:center}
nav.steps .n{width:24px;height:24px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
nav.steps .l{font-size:13px;line-height:1.1;font-weight:600}
nav.steps .l small{display:block;font-weight:400;color:var(--mut);font-size:11px}
nav.steps button.on{border-color:var(--yellow);background:#fff}
nav.steps button.on .n{background:var(--black);color:var(--yellow)}
nav.steps button.done .n{background:var(--green);color:#fff}
.vo{max-width:1280px;margin:0 auto;padding:8px 20px 0}
.vo .in{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vb{border:2px solid var(--black);background:var(--black);color:#fff;border-radius:99px;padding:4px 14px;font-weight:700;font-size:15px}
.vb.g{background:#fff;color:#111;border-color:#ccc}
.vp{flex:1 1 200px;height:5px;border-radius:3px;background:#e5e5e5;overflow:hidden}.vp i{display:block;height:100%;width:0;background:var(--yellow)}
.vo details{flex:1 1 100%;font-size:15px;color:#333}.vo summary{cursor:pointer;color:var(--mut)}
.vo details p{margin:6px 0 2px}
#vtxt span{transition:background .2s}#vtxt span.cur{background:var(--yellow-l);box-shadow:0 0 0 2px var(--yellow-l);border-radius:4px}
#wrap{margin:8px auto 0;overflow:hidden}
#scene{width:1280px;height:760px;transform-origin:0 0;background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.07);padding:20px 30px 16px;display:flex;flex-direction:column}
.sc{display:flex;flex-direction:column;height:100%}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 2px}
h2{font-size:31px;line-height:1.12;margin:0 0 10px}
.hd2{min-height:78px}
.bd{flex:1;display:grid;grid-template-columns:680px 1fr;gap:26px;min-height:0}
.bd.nom{grid-template-columns:1fr}
.mcol{display:flex;flex-direction:column;gap:6px}
.mbox{position:relative;width:680px;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.mbox img,.mbox video{width:100%;height:auto;display:block}
.mbox video{height:382px;object-fit:cover;cursor:pointer}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--red);color:#fff;border:3px solid #fff;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:opacity .4s,transform .4s}
.mk.pre{opacity:0;transform:scale(.3)}.mk.hl{background:var(--yellow);color:#111;transform:scale(1.25)}
.cap{font-size:13px;color:var(--mut)}
.ecol{overflow:auto;display:flex;flex-direction:column;gap:11px;padding:2px 6px 2px 2px}
.bd.nom .ecol{max-width:900px;margin:0 auto;width:100%}
.box{border-left:7px solid var(--yellow);background:var(--yellow-l);border-radius:0 10px 10px 0;padding:8px 14px}
.box b{display:block;font-size:19px}.box span{font-size:18px}
.box.red{border-color:var(--red);background:var(--red-l)}.box.green{border-color:var(--green);background:var(--green-l)}
ul.l{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.l li{padding:7px 10px 7px 34px;position:relative;font-size:19px;border-radius:8px}
ul.l li:before{content:"";position:absolute;left:11px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--yellow)}
ul.l li.ok:before{background:var(--green)}ul.l li.ko:before{background:var(--red)}
table.t{border-collapse:collapse;width:100%;font-size:17px}
table.t th{background:var(--black);color:#fff;text-align:left;padding:7px 9px;font-size:15px}
table.t td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.num{width:46px;text-align:center;font-weight:800;color:var(--red);font-size:18px}
table.t td img{height:38px;width:auto;display:block;background:#000;border-radius:6px}
.an{transition:opacity .5s ease,transform .5s ease,box-shadow .3s,background-color .3s}
.an.pre{opacity:0;transform:translateY(12px)}
.box.hl,li.hl{box-shadow:0 0 0 3px var(--yellow),0 6px 16px rgba(233,171,0,.3)}
li.hl,tr.hl td{background:var(--yellow-l)}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.ft .st{font-size:14px;color:var(--mut)}
.btn{border:0;border-radius:10px;padding:10px 22px;font-weight:700;font-size:17px;background:var(--black);color:#fff}
.btn:hover{background:#333}.btn.y{background:var(--yellow);color:#111}.btn.ghost{background:#fff;color:#111;border:2px solid #ccc}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:19px;display:flex;gap:14px;align-items:flex-start;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--yellow);background:var(--yellow-l)}
.opt .k{width:30px;height:30px;border-radius:8px;background:#eee;display:grid;place-items:center;font-weight:700;flex:none;font-size:16px}
.opt.right{border-color:var(--green);background:var(--green-l)}.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)}.opt.wrong .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:6px;padding:12px 16px;border-radius:10px;display:none;font-size:18px}
.fb.show{display:block}.fb.ok{background:var(--green-l);border-left:6px solid var(--green)}.fb.ko{background:var(--red-l);border-left:6px solid var(--red)}
.qbar{height:8px;border-radius:5px;background:#e5e5e5;margin-bottom:12px}.qbar i{display:block;height:100%;border-radius:5px;background:var(--yellow)}
.qw{max-width:980px;margin:0 auto;width:100%}
.res{text-align:center;max-width:760px;margin:0 auto}
.score{font-size:84px;font-weight:800;line-height:1}
footer.cr{max-width:1280px;margin:0 auto;padding:6px 20px 20px;font-size:12.5px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.an,.mk{transition:none}}
</style></head><body>

<script type="application/json" id="data">{"title":"Dreame T16 Pro Steam","sub":"Balai laveur · Déballage, connexion, utilisation, entretien et FAQ","items":[[1,"Introduction","Objectifs"],[2,"Déballage et montage","Partie 1 et 2"],[3,"Charge et Wi-Fi","Partie 3"],[4,"Préparation","Partie 4"],[5,"Nettoyage","Partie 5"],[6,"Auto-nettoyage","Partie 6"],[7,"Entretien","Partie 7"],[8,"Voyants d'anomalie","Partie 8"],[9,"Pannes courantes","Partie 9"],[10,"FAQ","10 questions"],[11,"Quiz final","10 questions"]],"screens":[{"id":"s01","item":1,"kicker":"Introduction","title":"Bienvenue dans la formation Dreame T16","media":{"t":"img","src":"t1","cap":"Dreame T16 Pro Steam – visuel de la vidéo officielle Dreame"},"els":[{"k":"li","t":"Durée : moins de 25 minutes","at":1},{"k":"li","t":"Déballage, montage, charge et connexion Wi-Fi","at":2},{"k":"li","t":"Utilisation, entretien et dépannage","at":2},{"k":"li","t":"FAQ de 10 questions","at":2},{"k":"li","t":"Quiz final de 10 questions, réussite à 80 %","at":3}],"narr":["Bienvenue dans cette formation dédiée au balai laveur Dreame T16.","L'objectif de ce module est de vous donner, en moins de vingt-cinq minutes, les connaissances essentielles pour mieux comprendre et accompagner l'utilisation de ce produit.","Nous verrons son déballage, sa connectivité, son entretien et les principales questions fréquentes.","La formation se terminera par un quiz de dix questions.","Bonne formation !"],"starts":[0.2,4.33,14.23,19.51,23.64],"dur":25.52},{"id":"s02","item":1,"kicker":"Introduction","title":"Ce que vous saurez faire","media":{"t":"none"},"els":[{"k":"li","t":"Déballer et identifier les éléments","at":0},{"k":"li","t":"Monter, charger et connecter l'appareil en Wi-Fi","at":1},{"k":"li","t":"Préparer, nettoyer et lancer l'auto-nettoyage","at":2},{"k":"li","t":"Entretenir, lire les voyants et dépanner","at":3},{"k":"box","tone":"key","t":"Parcours","b":"9 parties · 2 questions intermédiaires · FAQ · quiz final","at":4}],"narr":["À la fin de ce module, vous saurez déballer le produit et identifier chacun de ses éléments.","Vous saurez monter le manche, charger l'appareil et le connecter en Wi-Fi à l'application Dreamehome.","Vous saurez préparer l'appareil, choisir le bon mode de nettoyage, et lancer le nettoyage automatique.","Vous saurez entretenir les consommables, reconnaître les voyants d'anomalie et résoudre les pannes courantes.","Deux questions rapides jalonnent le parcours, avant le quiz final de dix questions."],"starts":[0.2,7.02,13.07,19.12,24.78],"dur":30.46},{"id":"s03","item":2,"kicker":"Partie 1 · Déballage","title":"Déballage : les éléments de la boîte","media":{"t":"img","src":"t10c","cap":"Contenu de la boîte (vidéo officielle Dreame)","mk":[{"n":1,"x":81.3,"y":42},{"n":2,"x":60,"y":23},{"n":3,"x":23,"y":60},{"n":4,"x":22,"y":17},{"n":5,"x":40.4,"y":21},{"n":6,"x":43.5,"y":65.7},{"n":7,"x":58.2,"y":65.4}]},"els":[{"k":"th","c":["Repère","Élément","À quoi il sert"]},{"k":"row","c":["1","Corps principal","Tête de lavage, réservoirs, moteur, écran"],"at":1},{"k":"row","c":["2","Manche","S'insère sur le corps principal"],"at":2},{"k":"row","c":["3","Socle de recharge","Charge l'appareil, sèche la brosse"],"at":3},{"k":"row","c":["4","Brosse de nettoyage","Réservoir d'eau sale et brosse rotative"],"at":4},{"k":"row","c":["5","Brosse rotative de rechange","Remplacement de la brosse"],"at":5},{"k":"row","c":["6","Filtre de rechange","Remplacement du filtre"],"at":5},{"k":"row","c":["7","Solution de nettoyage","Seul produit autorisé"],"at":6},{"k":"box","tone":"key","t":"À retenir","b":"Le contenu de la boîte peut varier selon les régions : se référer au produit réel.","at":7}],"narr":["Commençons par le déballage. Sortez les éléments de la boîte et repérez-les un par un.","Le corps principal, repère un, regroupe la tête de lavage, les réservoirs, le moteur et l'écran d'affichage.","Le manche, repère deux, s'insère sur le corps principal.","Le socle de recharge, repère trois, sert à charger l'appareil et à sécher la brosse.","La brosse de nettoyage, repère quatre, sert à nettoyer le réservoir d'eau sale et la brosse rotative.","Une brosse rotative de rechange, repère cinq, et un filtre de rechange, repère six, permettent de remplacer ces consommables.","Enfin, la solution de nettoyage, repère sept : c'est le seul produit à utiliser avec l'appareil.","Attention, le contenu de la boîte peut varier selon les régions. Référez-vous toujours au produit réel."],"starts":[0.2,6.25,13.07,16.81,22.86,29.68,37.27,43.7],"dur":50.53},{"id":"s04","item":2,"kicker":"Partie 2 · Montage","title":"Monter et démonter le manche","media":{"t":"vid","src":"p2"},"els":[{"k":"box","tone":"green","t":"Montage","b":"Insérer le manche verticalement dans le port du dessus, jusqu'au déclic.","at":1},{"k":"box","tone":"key","t":"Démontage","b":"Enfoncer les contacts avec un tournevis (ou un objet dur) dans le trou arrière, et tirer le manche vers le haut.","at":2},{"k":"box","tone":"red","t":"Attention","b":"Tirer le manche vers le haut en même temps que l'on enfonce les contacts.","at":3}],"narr":["Passons au montage du manche sur le corps principal.","Insérez le manche verticalement dans le port situé sur le dessus de l'appareil, jusqu'à entendre un déclic.","Pour le démontage, il faut enfoncer les contacts. Insérez un tournevis dans l'espace prévu à l'arrière de l'appareil.","Tirez en même temps le manche vers le haut.","Le montage est terminé : vous pouvez maintenant passer à la mise sous tension."],"starts":[0.2,3.94,10.76,17.96,21.7],"dur":27.76},{"id":"s05","item":3,"kicker":"Partie 3 · Charge","title":"Charger l'appareil","media":{"t":"vid","src":"p3a"},"els":[{"k":"li","t":"Charge complète avant la première utilisation (environ 4 h)","at":0},{"k":"li","t":"Socle contre un mur, sol plat, branché au secteur","at":1},{"k":"li","t":"Appareil posé sur le socle de recharge","at":2},{"k":"box","tone":"green","t":"Voyant vert fixe","b":"Niveau de batterie de 50 à 100 %","at":3},{"k":"box","tone":"red","t":"Voyant rouge","b":"Niveau de batterie ≤ 20 % : recharger","at":4},{"k":"box","tone":"key","t":"Veille","b":"10 minutes d'inactivité après la charge complète : redémarrer l'appareil.","at":5}],"narr":["Avant la première utilisation, l'appareil doit être complètement chargé. Prévoyez environ quatre heures.","Placez le socle de recharge contre un mur, sur un sol plat, et branchez-le à une prise de courant.","Posez ensuite l'appareil sur le socle de recharge.","Le voyant de batterie vous renseigne : vert fixe entre cinquante et cent pour cent de charge.","Il passe au rouge quand le niveau de la batterie est inférieur ou égal à vingt pour cent. C'est le moment de recharger.","Si l'appareil reste inutilisé dix minutes après la charge complète, il passe en veille : il faut alors le redémarrer."],"starts":[0.2,5.48,13.07,16.43,23.25,32.38],"dur":40.75},{"id":"s06","item":3,"kicker":"Partie 3 · Connectivité","title":"Connecter l'appareil en Wi-Fi","media":{"t":"vid","src":"p3b"},"els":[{"k":"li","t":"1. Télécharger l'application Dreamehome (code QR ou App Store)","at":0},{"k":"li","t":"2. Allumer l'appareil : appui bref sur l'interrupteur","at":1},{"k":"li","t":"3. Maintenir le bouton voix / Wi-Fi (à l'arrière) : voyant Wi-Fi blanc clignotant","at":2},{"k":"li","t":"4. Scanner le code QR dans l'application et suivre les instructions","at":3},{"k":"box","tone":"red","t":"Seul le Wi-Fi 2,4 GHz est reconnu","b":"Le Wi-Fi 5 GHz n'est pas pris en charge.","at":4},{"k":"box","tone":"key","t":"En cas d'échec","b":"Répéter les étapes. Paramètres d'usine : bouton Wi-Fi + bouton de nettoyage automatique, 3 secondes.","at":5}],"narr":["Pour piloter l'appareil, téléchargez l'application Dreamehome : scannez le code QR sur l'appareil ou cherchez « Dreamehome » dans l'App Store.","Mettez l'appareil sous tension avec un appui bref sur l'interrupteur d'alimentation.","Maintenez ensuite enfoncé le bouton de commande vocale et Wi-Fi, situé à l'arrière, pour configurer le réseau. Le voyant Wi-Fi clignote en blanc.","Ouvrez l'application, scannez le code QR de l'appareil, puis suivez les instructions pour l'ajouter.","Attention : seul le réseau Wi-Fi deux virgule quatre gigahertz est reconnu.","En cas d'échec, répétez ces étapes. Et pour rétablir les paramètres d'usine, maintenez trois secondes le bouton Wi-Fi et le bouton de nettoyage automatique."],"starts":[0.2,8.56,13.07,22.2,27.86,32.76],"dur":42.67},{"id":"s07","item":3,"kicker":"Partie 3 · Application","title":"Ce que permet l'application Dreamehome","media":{"t":"vid","src":"p3c"},"els":[{"k":"li","t":"Personnaliser les modes de nettoyage (aspiration, niveau d'eau)","at":1},{"k":"li","t":"Personnaliser le lavage et le séchage automatiques, ou les programmer","at":1},{"k":"li","t":"Suivre l'utilisation des accessoires","at":2},{"k":"li","t":"Alertes d'entretien et mises à jour du micrologiciel","at":3},{"k":"li","t":"Langue et volume de la voix","at":4}],"narr":["Une fois l'appareil connecté, l'application Dreamehome vous permet de personnaliser les modes de nettoyage.","Vous pouvez régler l'aspiration et le niveau d'eau, personnaliser le lavage et le séchage automatiques, ou programmer un nettoyage automatique.","Elle suit aussi l'utilisation de vos accessoires.","Vous recevez des alertes pour l'entretien et les mises à jour du micrologiciel.","Enfin, vous changez la langue et réglez le volume de la voix directement depuis l'application."],"starts":[0.2,5.86,13.83,16.8,22.08],"dur":28.53},{"id":"s08","item":4,"kicker":"Partie 4 · Préparation","title":"Remplir le réservoir d'eau propre","media":{"t":"vid","src":"p4"},"els":[{"k":"li","t":"Appuyer sur les boutons de déverrouillage : retirer le réservoir d'eau propre","at":1},{"k":"li","t":"Remplir d'eau propre, refermer l'entrée","at":2},{"k":"li","t":"Verser la solution dans la boîte à solution, refermer","at":3},{"k":"li","t":"Réinstaller jusqu'au déclic","at":4}],"narr":["Passons à la préparation. L'appareil dispose de deux réservoirs : le réservoir d'eau propre et le réservoir d'eau sale.","Appuyez sur les boutons de déverrouillage pour retirer le réservoir d'eau propre.","Ouvrez l'entrée du réservoir, remplissez-le d'eau propre, puis refermez-la bien.","Ajoutez ensuite la solution de nettoyage dans la boîte à solution, puis refermez-la bien.","Réinstallez le réservoir d'eau propre et assurez-vous qu'il est bien enclenché : vous devez entendre un déclic."],"starts":[0.2,7.79,12.69,16.82,22.48],"dur":29.7},{"id":"s09","item":4,"kicker":"Partie 4 · Produit de lavage","title":"Le produit de lavage : uniquement la solution Dreame","media":{"t":"img","src":"t100","cap":"Solution de nettoyage Dreame (vidéo officielle Dreame)"},"els":[{"k":"box","tone":"green","t":"Autorisé","b":"Eau propre + solution de nettoyage Dreame","at":1},{"k":"box","tone":"red","t":"Interdit","b":"Tout autre liquide : alcool, désinfectant…","at":2},{"k":"box","tone":"key","t":"Dosage","b":"Rapport solution / eau indiqué sur le flacon. Dosage automatique activé par défaut (modifiable dans l'application).","at":3},{"k":"li","t":"Solution hors de portée des enfants","at":4}],"narr":["Un point essentiel : utilisez uniquement la solution de nettoyage Dreame.","Dans le réservoir d'eau propre, vous ne pouvez verser que de l'eau propre et la solution nettoyante agréée.","N'ajoutez aucun autre liquide, comme de l'alcool ou un désinfectant.","Le rapport entre la solution et l'eau figure sur le flacon. Le réglage automatique du dosage est activé par défaut.","Gardez la solution nettoyante hors de la portée des enfants."],"starts":[0.2,4.71,11.91,16.04,24.01],"dur":28.54},{"id":"s10","item":5,"kicker":"Partie 5 · Nettoyage","title":"Démarrer le nettoyage","media":{"t":"vid","src":"p5a"},"els":[{"k":"li","t":"Appui sur le bouton d'alimentation pour démarrer","at":1,"tone":"ok"},{"k":"li","t":"Incliner l'appareil vers l'arrière","at":2,"tone":"ok"},{"k":"li","t":"Nettoyer uniquement la mousse produite par l'appareil","at":3,"tone":"ok"},{"k":"li","t":"Éviter les grandes accumulations de mousse venant d'autres sources","at":4,"tone":"ko"}],"narr":["Voyons maintenant comment nettoyer.","Appuyez sur le bouton d'alimentation pour démarrer le nettoyage.","Inclinez l'appareil vers l'arrière, comme sur la vidéo.","Avec le produit de lavage, l'appareil forme de la mousse : nettoyez uniquement la mousse produite par l'appareil.","Évitez les grandes accumulations de mousse provenant d'autres sources."],"starts":[0.2,2.02,5.76,9.12,16.32],"dur":20.46},{"id":"s11","item":5,"kicker":"Partie 5 · Ce qu'on peut faire ou non","title":"Ce que l'on peut faire, et ce que l'on ne fait pas","media":{"t":"vid","src":"p5b"},"els":[{"k":"box","tone":"red","t":"Ne pas faire","b":"Soulever directement l'appareil en marche · le retourner","at":1},{"k":"box","tone":"green","t":"Sols adaptés","b":"Carrelage, vinyle, marbre, bois scellé – pas de tapis, intérieur uniquement","at":2},{"k":"box","tone":"red","t":"Ne pas aspirer","b":"Liquides mousseux, verre, clous, objets durs ou pointus","at":3},{"k":"box","tone":"red","t":"Éviter","b":"Salles de bains et abords des piscines","at":4}],"narr":["Quelques règles d'usage à connaître.","Ne soulevez pas l'appareil directement pendant son fonctionnement, et ne le retournez pas : l'eau sale risque de s'écouler dans le moteur.","Utilisez-le uniquement à l'intérieur, sur des sols durs comme le carrelage, le vinyle, le marbre ou le bois scellé. Pas de tapis.","N'aspirez pas de liquides mousseux, ni d'objets durs ou pointus comme du verre ou des clous.","Évitez aussi les salles de bains et les abords des piscines."],"starts":[0.2,2.4,11.14,19.88,26.31],"dur":31.22},{"id":"s12","item":5,"kicker":"Partie 5 · Modes de nettoyage","title":"Les modes : Intelligent, Eau chaude et Vapeur","media":{"t":"vid","src":"p5c"},"els":[{"k":"box","tone":"key","t":"Bouton Mode","b":"Appuyer pour passer d'un mode à l'autre. À l'allumage suivant, l'appareil reprend le dernier mode utilisé.","at":0},{"k":"box","tone":"green","t":"Mode Intelligent","b":"Saletés sèches et humides du quotidien · aspiration réglée selon la détection de saleté","at":1},{"k":"box","tone":"red","t":"Mode Eau chaude – 90 °C","b":"Attendre que l'eau chauffe · taches tenaces de graisse et d'huile","at":2},{"k":"box","tone":"key","t":"Mode Vapeur – 200 °C","b":"Préparation de la vapeur en cours : patienter","at":3}],"narr":["Appuyez sur le bouton Mode pour changer de mode. L'écran affiche les modes disponibles.","Le mode Intelligent est conçu pour les saletés sèches et humides du quotidien. L'aspiration est réglée automatiquement selon la détection de la saleté.","En mode Eau chaude, attendez que l'eau chauffe à quatre-vingt-dix degrés. Il élimine les taches tenaces de graisse et d'huile.","En mode Vapeur, patientez pendant la préparation de la vapeur à deux cents degrés."],"starts":[0.2,5.86,14.99,22.96],"dur":29.02},{"id":"s13","item":5,"kicker":"Partie 5 · Modes de nettoyage","title":"Les modes : Aspiration et Personnalisé","media":{"t":"vid","src":"p5d"},"els":[{"k":"box","tone":"key","t":"Mode Aspiration","b":"Liquides renversés, poils et cheveux","at":1},{"k":"box","tone":"green","t":"Mode Personnalisé","b":"Niveau d'aspiration et d'eau choisi dans l'application Dreamehome","at":2},{"k":"box","tone":"key","t":"5 modes","b":"Intelligent · Eau chaude · Vapeur · Aspiration · Personnalisé","at":3}],"narr":["Deux autres modes complètent la gamme.","Le mode Aspiration sert à aspirer efficacement les liquides renversés et les poils ou cheveux.","Le mode Personnalisé vous laisse sélectionner votre niveau d'aspiration et d'eau préféré, depuis l'application Dreamehome.","Retenez : cinq modes sont disponibles. Intelligent, Eau chaude, Vapeur, Aspiration et Personnalisé."],"starts":[0.2,2.79,8.84,14.89],"dur":20.57},{"id":"s14","item":6,"kicker":"Partie 6 · Auto-nettoyage","title":"Le nettoyage automatique par simple pression","media":{"t":"vid","src":"p6a"},"els":[{"k":"li","t":"Appareil posé sur le socle","at":1},{"k":"li","t":"Batterie > 20 % (25 % pour le nettoyage auto intelligent à la vapeur)","at":1},{"k":"li","t":"Appui sur le bouton de nettoyage automatique","at":2},{"k":"li","t":"Eau suffisante dans le réservoir d'eau propre","at":3},{"k":"box","tone":"red","t":"Danger de brûlure","b":"Ne pas toucher la brosse rotative, l'eau chaude ou le module de chauffe pendant le nettoyage automatique à l'eau chaude.","at":4},{"k":"li","t":"Après le lavage de la brosse : séchage automatique","at":5}],"narr":["Après utilisation, l'appareil se nettoie tout seul d'une simple pression.","Placez l'appareil sur le socle et assurez-vous que le niveau de batterie est supérieur à vingt pour cent, vingt-cinq pour cent pour le nettoyage automatique intelligent à la vapeur.","Appuyez sur le bouton de nettoyage automatique pour commencer.","Vérifiez aussi qu'il y a assez d'eau dans le réservoir d'eau propre.","Ne touchez pas la brosse rotative, l'eau chaude ou le module de chauffe pendant le nettoyage automatique à l'eau chaude.","Une fois la brosse lavée, l'appareil passe automatiquement en mode séchage."],"starts":[0.2,4.33,15.76,19.5,24.4,32.37],"dur":37.28},{"id":"s15","item":6,"kicker":"Partie 6 · Séchage","title":"Le séchage : 30 minutes ou 5 minutes","media":{"t":"vid","src":"p6b"},"els":[{"k":"li","t":"Séchage direct : appui long de 3 secondes sur le bouton de nettoyage auto","at":0},{"k":"box","tone":"key","t":"Séchage par défaut : 30 minutes","b":"Mode séchage indépendant ou après le nettoyage automatique","at":1},{"k":"box","tone":"green","t":"Séchage rapide : 5 minutes","b":"Appuyer de nouveau sur le bouton dans les 3 secondes","at":2},{"k":"li","t":"Batterie faible : cycle combiné charge + séchage de 30 minutes","at":3},{"k":"li","t":"Appui bref : quitter le séchage","at":4}],"narr":["Vous pouvez aussi lancer directement le séchage automatique : appuyez longuement pendant trois secondes sur le bouton de nettoyage automatique.","Le séchage dure trente minutes par défaut.","Pour passer au séchage rapide de cinq minutes, appuyez de nouveau sur le bouton dans les trois secondes.","Quand la batterie est faible, le séchage de cinq minutes devient un cycle combiné de charge et de séchage de trente minutes.","En mode séchage, un appui bref sur le bouton permet de quitter le séchage."],"starts":[0.2,8.17,11.14,18.34,27.08],"dur":33.14},{"id":"s16","item":6,"kicker":"Partie 6 · Réservoir d'eau sale","title":"Nettoyer le réservoir d'eau sale","media":{"t":"vid","src":"p6c"},"els":[{"k":"box","tone":"red","t":"Tout de suite après l'auto-nettoyage","b":"Nettoyer le réservoir d'eau sale pour éviter les odeurs","at":0},{"k":"li","t":"Retirer le réservoir, le couvercle et le filtre","at":1},{"k":"li","t":"Vider l'eau sale, rincer le réservoir et son couvercle","at":2},{"k":"li","t":"Brosse de nettoyage : parois intérieures du réservoir","at":3},{"k":"li","t":"Filtre dans le couvercle, couvercle dans le réservoir","at":4},{"k":"li","t":"Replacer jusqu'au déclic","at":5}],"narr":["Après le nettoyage automatique, nettoyez immédiatement le réservoir d'eau sale pour éviter les odeurs.","Tirez sur la poignée du réservoir pour le retirer. Retirez le couvercle, puis le filtre, et éliminez les débris du filtre.","Videz l'eau sale et rincez le réservoir et son couvercle à l'eau propre.","Utilisez la brosse de nettoyage fournie pour nettoyer les parois intérieures du réservoir.","Réassemblez le réservoir : le filtre dans le couvercle, puis le couvercle dans le réservoir.","Replacez le réservoir dans l'appareil, jusqu'au déclic."],"starts":[0.2,5.86,14.22,19.5,24.78,30.83],"dur":34.2},{"id":"s17","item":7,"kicker":"Partie 7 · Entretien","title":"Filtre et tube d'aspiration","media":{"t":"vid","src":"p7a"},"els":[{"k":"box","tone":"key","t":"Au moins une fois par trimestre","b":"Entretien recommandé pour des performances optimales","at":0},{"k":"li","t":"Filtre : retirer, dépoussiérer, rincer à l'eau propre si sale","at":1},{"k":"li","t":" ui dans les trois secondes passe au séchage rapide de cinq minutes.","rub":"Item 6 · Auto-nettoyage"},{"q":"Que faut-il faire dès la fin du nettoyage automatique ?","opts":["Vider et nettoyer le réservoir d'eau sale pour éviter les odeurs","Rincer le tube sous le robinet","Retirer la batterie","Ranger l'appareil sans rien faire"],"ok":0,"ex":"Il faut nettoyer immédiatement le réservoir d'eau sale pour éviter les odeurs.","narrQ":"Question six. Que faut-il faire dès la fin du nettoyage automatique ?","narrC":"Il faut vider et nettoyer tout de suite le réservoir d'eau sale, pour éviter les odeurs.","rub":"Item 6 · Auto-nettoyage"},{"q":"Comment nettoyer le tube d'aspiration ?","opts":["Le rincer abondamment sous le robinet","Le passer au lave-vaisselle","Le laisser sécher sans y toucher","L'essuyer délicatement avec un chiffon humide, sans le rincer"],"ok":3,"ex":"Le tube s'essuie délicatement avec un chiffon humide. Il ne se rince pas.","narrQ":"Question sept. Comment nettoyer le tube d'aspiration ?","narrC":"On l'essuie délicatement avec un chiffon humide. On ne rince pas le tube.","rub":"Item 7 · Entretien"},{"q":"De l'eau s'échappe par l'orifice de sortie. Quelle vérification faire en priorité ?","opts":["Remplacer la batterie","Redémarrer l'application","Vérifier que le filtre est complètement sec","Passer en mode Aspiration"],"ok":2,"ex":"Un filtre qui n'est pas complètement sec peut provoquer une fuite : le sécher avant utilisation. Un choc ou une traction brutale peut aussi faire entrer de l'eau dans le moteur.","narrQ":"Question huit. De l'eau s'échappe par l'orifice de sortie. Quelle vérification faire en priorité ?","narrC":"Il faut vérifier que le filtre est complètement sec avant de l'utiliser.","rub":"Item 9 · Pannes"},{"q":"À quelle fréquence la notice recommande-t-elle de remplacer le filtre et la brosse rotative ?","opts":["Tous les mois","Tous les 3 à 6 mois","Tous les 2 ans","Jamais"],"ok":1,"ex":"La notice recommande de remplacer le filtre et la brosse rotative tous les 3 à 6 mois.","narrQ":"Question neuf. À quelle fréquence la notice recommande-t-elle de remplacer le filtre et la brosse rotative ?","narrC":"Tous les trois à six mois, selon la notice.","rub":"Item 7 · Entretien"},{"q":"Le voyant « niveau d'eau insuffisant » s'allume. Que faire ?","opts":["Remplir le réservoir d'eau propre","Vider le réservoir d'eau sale","Nettoyer la brosse rotative","Recharger la batterie"],"ok":0,"ex":"Ce voyant signale un niveau d'eau insuffisant dans le réservoir d'eau propre : il faut le remplir.","narrQ":"Question dix. Le voyant niveau d'eau insuffisant s'allume. Que faire ?","narrC":"Il faut remplir le réservoir d'eau propre.","rub":"Item 8 · Voyants"}],"minutes":23,"pass":80}</script>

 const g=k=>{try{return String(api.LMSGetValue(k))}catch(e){return ''}};
 const st=(k,v)=>{try{api.LMSSetValue(k,String(v))}catch(e){}};
 const cm=()=>{try{api.LMSCommit('')}catch(e){}};
 const p2=n=>('0'+n).slice(-2);
 const fmt=ms=>{const t=Math.round(ms/1000);return ('000'+Math.floor(t/3600)).slice(-4)+':'+p2(Math.floor(t%3600/60))+':'+p2(t%60)};
 return{active:()=>!!api,
  init(){if(!api)return null;try{api.LMSInitialize('')}catch(e){api=null;return null}
   const s=g('cmi.core.lesson_status');if(s==='not attempted'||s==='')st('cmi.core.lesson_status','incomplete');
   passed=(s==='passed'||s==='completed');let sd=null;try{sd=JSON.parse(g('cmi.suspend_data')||'null')}catch(e){}cm();return sd},
  sync(){if(!api)return;st('cmi.suspend_data',JSON.stringify({c:ST.cur,v:ST.vis,a:ST.ans,i:ST.iqa,b:ST.best}));st('cmi.core.lesson_location',String(ST.cur));cm()},
  result(score,ok){if(!api)return;st('cmi.core.score.min',0);st('cmi.core.score.max',100);st('cmi.core.score.raw',Math.max(score,ST.best||0));
   if(ok){passed=true;st('cmi.core.lesson_status','passed')}else if(!passed){st('cmi.core.lesson_status','failed')}this.sync()},
  end(){if(!api||closed)return;closed=true;st('cmi.core.session_time',fmt(Date.now()-t0));st('cmi.core.exit',passed?'':'suspend');cm();try{api.LMSFinish('')}catch(e){}}}})();
const sd0=SC.init();
if(sd0){ST=Object.assign(ST,{cur:sd0.c||0,vis:sd0.v||{},ans:sd0.a||{},iqa:sd0.i||{},best:sd0.b||0})}
else if(!SC.active()){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)ST=Object.assign(ST,x)}catch(e){}}
const save=()=>{if(SC.active())SC.sync();else{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}};
['pagehide','beforeunload','unload'].forEach(e=>window.addEventListener(e,()=>SC.end()));
/* ===== Voix off + animation ===== */
let voiceOn=true;try{voiceOn=localStorage.getItem('fd-voice')!=='0'}catch(e){}
const AUD=new Audio();AUD.preload='auto';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
const ANIM={items:[],tl:[],raf:0,on:false,lastIdx:-9};
function showAll(){ANIM.on=false;cancelAnimationFrame(ANIM.raf);$$('.an,.mk').forEach(e=>e.classList.remove('pre','hl'));$$('#vtxt span').forEach(e=>e.classList.remove('cur'))}
function tick(){
 if(!ANIM.on)return;
 const t=AUD.currentTime;let idx=-1;ANIM.tl.forEach((s,i)=>{if(t>=s)idx=i});
 if(idx!==ANIM.lastIdx){ANIM.lastIdx=idx;
  ANIM.items.forEach(e=>{const a=+e.dataset.at;e.classList.toggle('pre',a>idx);e.classList.toggle('hl',a===idx&&idx>=0)});
  $$('.mk').forEach(m=>{const r=ANIM.items.find(e=>e.dataset.n===m.dataset.n);if(r){m.classList.toggle('pre',r.classList.contains('pre'));m.classList.toggle('hl',r.classList.contains('hl'))}});
  $$('#vtxt span').forEach((e,i)=>e.classList.toggle('cur',i===idx));
 }
 const dur=AUD.duration||D.screens.find(s=>s.id===curId())?.dur||1;
 $('#vprog i').style.width=Math.min(100,100*t/dur)+'%';
 ANIM.raf=requestAnimationFrame(tick)}
const curId=()=>PAGES[ST.cur].id;
function updV(){const pl=$('#vplay'),mu=$('#vmute');pl.textContent=AUD.paused?'▶ Écouter':'⏸ Pause';mu.textContent=voiceOn?'🔊 Voix off activée':'🔇 Voix off coupée';mu.setAttribute('aria-pressed',voiceOn)}
AUD.addEventListener('play',updV);AUD.addEventListener('pause',updV);
AUD.addEventListener('ended',()=>{updV();if(PAGES[ST.cur].t==='s')showAll()});
function playAudio(id,anim){
 AUD.pause();cancelAnimationFrame(ANIM.raf);AUD.src='audio/'+id+'.mp3';AUD.currentTime=0;$('#vprog i').style.width='0';
 if(!voiceOn){if(anim)showAll();updV();return}
 if(anim){ANIM.on=!RM;ANIM.lastIdx=-9;if(RM)showAll();}
 const p=AUD.play();
 if(p&&p.catch)p.catch(()=>{if(anim)showAll();updV()});
 if(anim&&ANIM.on)ANIM.raf=requestAnimationFrame(tick);
}
$('#vplay').onclick=()=>{if(!AUD.src||AUD.ended||(AUD.paused&&AUD.currentTime===0)){const p=PAGES[ST.cur];if(p.t==='s'){mountAnim(p.s);}playAudio(p.t==='s'?p.id:p.id+'q',p.t==='s')}else if(AUD.paused){AUD.play();if(ANIM.items.length&&!ANIM.on&&AUD.currentTime<(AUD.duration||0)-.1){ANIM.on=true;tick()}}else AUD.pause()};
$('#vmute').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('fd-voice',voiceOn?'1':'0')}catch(e){}if(!voiceOn){AUD.pause();showAll()}updV()};
function mountAnim(s){
 ANIM.items=$$('#scene [data-at]').map(e=>e);ANIM.tl=s.starts;
 ANIM.items.forEach(e=>e.classList.add('pre'));$$('.mk').forEach(e=>e.classList.add('pre'));
}
/* ===== Rendu ===== */
function mediaHTML(m){
 if(!m||m.t==='none')return '';
 if(m.t==='img'){return '<div class="mbox"><img src="'+IMG[m.src]+'" alt="'+esc(m.cap||'')+'">'+(m.mk||[]).map(k=>'<span class="mk an" data-n="'+k.n+'" style="left:'+k.x+'%;top:'+k.y+'%">'+k.n+'</span>').join('')+'</div>'+(m.cap?'<div class="cap">'+esc(m.cap)+'</div>':'')}
 return '<div class="mbox"><video src="video/'+m.src+'.mp4" muted playsinline loop autoplay preload="auto"></video></div><div class="cap">Extrait de la vidéo officielle Dreame (images et sous-titres du constructeur)</div>'}
function elsHTML(els){
 let h='',i=0;
 while(i<els.length){const e=els[i];
  if(e.k==='th'){let rows='',j=i+1;while(j<els.length&&els[j].k==='row'){const r=els[j];const n=/^\d+$/.test(r.c[0]);
    rows+='<tr class="an" data-at="'+r.at+'"'+(n?' data-n="'+r.c[0]+'"':'')+'>'+r.c.map((c,ci)=>ci===0&&n?'<td class="num">'+c+'</td>':(ci===0&&IMG[c]?'<td><img src="'+IMG[c]+'" alt=""></td>':'<td>'+esc(c)+'</td>')).join('')+'</tr>';j++}
   h+='<table class="t"><thead><tr>'+e.c.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>';i=j;continue}
  if(e.k==='li'){let lis='',j=i;while(j<els.length&&els[j].k==='li'){const x=els[j];lis+='<li class="an'+(x.tone?' '+x.tone:'')+'" data-at="'+x.at+'">'+esc(x.t)+'</li>';j++}h+='<ul class="l">'+lis+'</ul>';i=j;continue}
  if(e.k==='box'){h+='<div class="box '+(e.tone==='key'?'':e.tone||'')+' an" data-at="'+e.at+'"><b>'+esc(e.t)+'</b><span>'+esc(e.b)+'</span></div>'}
  i++}
 return h}
function fit(){const wr=$('#wrap');wr.style.width='';const w=Math.min(1280,document.documentElement.clientWidth),top=wr.getBoundingClientRect().top+window.scrollY,k=Math.max(.3,Math.min(1,w/1280,(window.innerHeight-top-10)/760));$('#scene').style.transform='scale('+k+')';wr.style.width=(1280*k)+'px';wr.style.height=(760*k)+'px'}
window.addEventListener('resize',fit);
const itemPages=n=>PAGES.map((p,i)=>[p,i]).filter(x=>x[0].item===n).map(x=>x[1]);
function nav(){
 const box=$('nav.steps .in');box.innerHTML='';const curItem=PAGES[ST.cur].item;
 D.items.forEach(it=>{const ps=itemPages(it[0]);const done=ps.every(i=>ST.vis[i])&&curItem!==it[0];
  const b=document.createElement('button');b.type='button';b.className=(curItem===it[0]?'on ':'')+(done?'done':'');
  b.innerHTML='<span class="n">'+(done?'✓':it[0])+'</span><span class="l">'+esc(it[1])+'<small>'+esc(it[2])+'</small></span>';
  b.onclick=()=>go(ps[0]);box.appendChild(b)});
 $('.bar i').style.width=(100*(ST.cur)/(PAGES.length-1))+'%';
 $('#pg').textContent='Écran '+(ST.cur+1)+' / '+PAGES.length+' · ≈ '+D.minutes+' min'}
function go(i){i=Math.max(0,Math.min(PAGES.length-1,i));ST.cur=i;ST.vis[i]=1;save();render()}
function footer(extra){return '<div class="ft"><button class="btn ghost" id="pv"'+(ST.cur===0?' disabled':'')+'>← Précédent</button><span class="st">'+esc(extra||'')+'</span><button class="btn y" id="nx">Suivant →</button></div>'}
function wireFooter(nextOk,nextLabel){const pv=$('#pv'),nx=$('#nx');pv.onclick=()=>go(ST.cur-1);if(nextLabel)nx.textContent=nextLabel;nx.disabled=!nextOk;nx.onclick=()=>go(ST.cur+1)}
function setTranscript(sents){$('#vtxt').innerHTML=sents.map(s=>'<span>'+esc(s)+' </span>').join('');}
function render(){
 const p=PAGES[ST.cur],sc=$('#scene');cancelAnimationFrame(ANIM.raf);ANIM.items=[];ANIM.on=false;
 nav();
 if(p.t==='s'){const s=p.s;
  sc.innerHTML='<div class="sc"><div class="hd2"><p class="kicker">'+esc(s.kicker)+'</p><h2>'+esc(s.title)+'</h2></div><div class="bd'+(s.media.t==='none'?' nom':'')+'"><div class="mcol">'+mediaHTML(s.media)+'</div><div class="ecol">'+elsHTML(s.els)+'</div></div>'+footer('')+'</div>';
  wireFooter(true);setTranscript(s.narr);mountAnim(s);$('#vsum').textContent='Transcription de la voix off';
  playAudio(s.id,true)}
 else if(p.t==='q'||p.t==='iq'){const q=p.q,quiz=p.t==='q';const key=quiz?p.i:p.id;const store=quiz?ST.ans:ST.iqa;
  const L='ABCD';
  sc.innerHTML='<div class="sc"><div class="hd2"><p class="kicker">'+(quiz?'Quiz final · Question '+(p.i+1)+' sur 10 · '+esc(q.rub):esc(q.kicker))+'</p></div><div class="qw">'+(quiz?'<div class="qbar"><i style="width:'+(100*(p.i)/10)+'%"></i></div>':'')+'<h2>'+esc(q.q)+'</h2><div class="opts">'+q.opts.map((o,i)=>'<button type="button" class="opt" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+esc(o)+'</span></button>').join('')+'</div><div class="fb"></div></div>'+footer(quiz?'':'Question de contrôle (non notée)')+'</div>';
  const opts=$$('.opt'),fb=$('.fb');
  function show(c,play){opts.forEach((b,i)=>{b.disabled=true;if(i===q.ok)b.classList.add('right');else if(i===c)b.classList.add('wrong')});
   const okk=c===q.ok;fb.className='fb show '+(okk?'ok':'ko');fb.innerHTML='<b>'+(okk?'Bonne réponse. ':'Pas tout à fait. ')+'</b>La bonne réponse est '+L[q.ok]+'. '+esc(q.ex||q.expl);
   setTranscript([q.narrC]);if(play)playAudio(p.id+'c',false);wireFooter(true,quiz&&p.i===9?'Voir mon résultat →':'Suivant →')}
  wireFooter(false);setTranscript([q.narrQ]);
  opts.forEach(b=>b.onclick=()=>{const c=+b.dataset.i;store[key]=c;save();show(c,true)});
  if(store[key]!==undefined)show(store[key],false);
  playAudio(p.id+'q',false)}
 else{let n=0;D.quiz.forEach((q,i)=>{if(ST.ans[i]===q.ok)n++});const score=n*10,ok=score>=D.pass;ST.best=Math.max(ST.best||0,score);
  sc.innerHTML='<div class="sc"><div class="hd2"><p class="kicker">Quiz final · Résultat</p></div><div class="res"><div class="score" style="color:'+(ok?'var(--green)':'var(--red)')+'">'+n+' / 10</div><h2 style="margin-top:10px">'+(ok?'Bravo, module validé !':'Module non validé')+'</h2><p>Score : '+score+' % · seuil de réussite : '+D.pass+' %.</p><p>'+(ok?'Vous maîtrisez les points essentiels du balai laveur Dreame T16 Pro Steam.':'Revoyez les parties du module, puis recommencez le quiz.')+'</p><div style="display:flex;gap:12px;justify-content:center;margin-top:18px"><button class="btn" id="retry">Refaire le quiz</button></div></div>'+footer('')+'</div>';
  wireFooter(false);$('#nx').style.visibility='hidden';setTranscript(['']);
  $('#retry').onclick=()=>{ST.ans={};save();go(PAGES.findIndex(x=>x.t==='q'))};
  SC.result(score,ok);save();AUD.pause()}
 updV();fit();
}
$('#hsub').textContent=D.sub;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!$('#nx').disabled)$('#nx').click();if(e.key==='ArrowLeft'&&!$('#pv').disabled)$('#pv').click()});
window.addEventListener('pagehide',()=>save());
ST.vis[ST.cur]=1;render();
</script></body></html>
